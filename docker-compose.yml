services:
  mysql:
    image: mysql:8.4
    container_name: innovatech_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      # Named volume para persistencia de datos MySQL.
      # Elegido sobre bind mount porque:
      # 1. Docker gestiona el ciclo de vida del volumen (portabilidad)
      # 2. Funciona igual en Windows, macOS y Linux
      # 3. Los datos sobreviven a docker compose down (no así el contenedor)
      # 4. Facilita backups con docker run --volumes-from
      - mysql_data:/var/lib/mysql
    networks:
      - innovatech_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    image: back-ventas:local
    container_name: back_ventas
    restart: unless-stopped
    environment:
      DB_ENDPOINT: ${DB_ENDPOINT}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: "jdbc:mysql://${DB_ENDPOINT}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - innovatech_net

  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    image: back-despachos:local
    container_name: back_despachos
    restart: unless-stopped
    environment:
      DB_ENDPOINT: ${DB_ENDPOINT}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: "jdbc:mysql://${DB_ENDPOINT}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - innovatech_net

  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    image: front-despacho:local
    container_name: front_despacho
    restart: unless-stopped
    environment:
      # Nginx envsubst reemplaza estos valores en el template al iniciar
      VENTAS_HOST: back-ventas
      DESPACHOS_HOST: back-despachos
    depends_on:
      - back-ventas
      - back-despachos
    ports:
      # Mapea puerto 80 del host al 8080 del contenedor Nginx
      - "80:8080"
    networks:
      - innovatech_net

volumes:
  # Volumen nombrado para persistencia de MySQL.
  # Ventajas sobre bind mount:
  # - Portabilidad entre SO (sin rutas absolutas)
  # - Gestión nativa por Docker (backup, restore, inspección)
  # - Aislado del sistema de archivos del host (seguridad)
  # La información crítica de la BD no se pierde al reiniciar contenedores
  # porque Docker persiste el volumen independientemente del ciclo de vida
  # del contenedor. Solo se elimina con "docker compose down -v".
  mysql_data:

networks:
  innovatech_net:
    driver: bridge
