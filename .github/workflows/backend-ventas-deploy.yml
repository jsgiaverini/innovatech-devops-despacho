name: Backend Ventas CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - deploy
    paths:
      - 'back-Ventas_SpringBoot/**'
      - 'deploy/backend/**'
      - '.github/workflows/backend-ventas-deploy.yml'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: back-ventas

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener IP publica del runner
        id: runner-ip
        shell: bash
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com | tr -d '\n')
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "Runner IP: $RUNNER_IP"

      - name: Autorizar SSH temporal hacia EC2 Backend
        shell: bash
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.BACKEND_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ip }}/32" \
            --region "${{ env.AWS_REGION }}" || true

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag y push de imagen Docker a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Sincronizar docker-compose backend a EC2 Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/backend/docker-compose.yml"
          target: "/home/ec2-user/innovatech-backend"
          strip_components: 2

      - name: Desplegar en EC2 Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo systemctl start docker
            sudo systemctl enable docker
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            cd /home/ec2-user/innovatech-backend
            export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
            export DB_NAME=${{ secrets.DB_NAME }}
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            echo "Esperando disponibilidad de MySQL..."
            for i in {1..30}; do
              if docker exec innovatech_mysql mysqladmin ping -uroot --silent; then
                echo "MySQL disponible"
                break
              fi
              echo "MySQL aun no disponible, intento $i/30"
              sleep 5
            done

            docker exec innovatech_mysql mysql -uroot -e "CREATE DATABASE IF NOT EXISTS ${DB_NAME}; CREATE USER IF NOT EXISTS '${DB_USERNAME}'@'%' IDENTIFIED BY '${DB_PASSWORD}'; ALTER USER '${DB_USERNAME}'@'%' IDENTIFIED BY '${DB_PASSWORD}'; GRANT ALL PRIVILEGES ON ${DB_NAME}.* TO '${DB_USERNAME}'@'%'; FLUSH PRIVILEGES;" || true
            docker compose restart back-ventas back-despachos
            docker image prune -f
            echo "Backend Ventas desplegado correctamente en EC2"

      - name: Revocar SSH temporal hacia EC2 Backend
        if: always()
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.BACKEND_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ip }}/32" \
            --region "${{ env.AWS_REGION }}" || true


