name: Backend Despachos CI/CD - Build, Push & Deploy ECS

on:
  push:
    branches:
      - deploy
    paths:
      - 'back-Despachos_SpringBoot/**'
      - '.github/workflows/backend-despachos-deploy.yml'

permissions:
  contents: read

concurrency:
  group: backend-despachos-ecs-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: back-despachos
  ECS_CLUSTER: innovatech-cluster
  ECS_SERVICE: back-despachos-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/pom.xml

      - name: Validar backend
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: ./mvnw -B test

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag y push de imagen Docker a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Escaneo informativo Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Desplegar en ECS forzando nueva deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Esperar estabilidad y comprobar API de despachos
        run: |
          echo "[ECS] Esperando estabilidad de $ECS_SERVICE..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION"
          ALB_DNS=$(aws elbv2 describe-load-balancers --names alb-innovatech --query 'LoadBalancers[0].DNSName' --output text --region "$AWS_REGION")
          echo "[SMOKE] Comprobando http://$ALB_DNS/api/v1/despachos"
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-all-errors "http://$ALB_DNS/api/v1/despachos" --output /dev/null
          echo "[OK] API de despachos estable y accesible."
