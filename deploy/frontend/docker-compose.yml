services:
  frontend:
    image: ${ECR_REGISTRY}/front-despacho:latest
    container_name: front_despacho
    restart: unless-stopped
    environment:
      VENTAS_HOST: ${BACKEND_HOST}
      DESPACHOS_HOST: ${BACKEND_HOST}
    ports:
      - "80:8080"
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
